<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Le Défilé Runway</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one full-screen walkable scene of the Cour des Adieux built from our photographs; quiet masthead top-left, one control dock at the bottom. Single dusk look by choice. */
:root {
  --ink: #141210;
  --cream: #F2EEE6;
  --cream-dim: rgba(242, 238, 230, 0.82);
  --runway-red: #A8111D;
  --glass: rgba(20, 18, 16, 0.5);
  --line: rgba(242, 238, 230, 0.5);
  --display: 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --body: Jost, Futura, 'Century Gothic', 'Helvetica Neue', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--ink); color: var(--cream); font-family: var(--body); overflow: hidden; }
#scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
#scene:active { cursor: grabbing; }
.shade { position: fixed; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(20,18,16,0.5) 0%, rgba(20,18,16,0) 22%, rgba(20,18,16,0) 62%, rgba(20,18,16,0.66) 100%); }

.ui {
  position: fixed; inset: 0; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; justify-content: space-between;
}
.brand { display: flex; flex-direction: column; gap: 6px; max-width: 34rem; }
.eyebrow { margin: 0; font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; color: var(--cream-dim); }
h1 { margin: 0; font-family: var(--display); font-weight: 300; font-size: clamp(2.4rem, 7vw, 4.2rem); line-height: 0.9; }
.tag { margin: 0; font-family: var(--display); font-style: italic; font-weight: 300; font-size: clamp(1.05rem, 2.4vw, 1.45rem); }

.bottom { display: flex; flex-direction: column; align-items: center; gap: 12px; }
.hint { margin: 0; font-size: 0.8rem; letter-spacing: 0.05em; color: var(--cream-dim); text-align: center; min-height: 1.2em; }
.controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; pointer-events: auto; }
button {
  font-family: var(--body); font-size: 0.74rem; letter-spacing: 0.2em; text-transform: uppercase;
  min-height: 46px; padding: 0 18px; border-radius: 0; cursor: pointer;
  border: 1px solid var(--cream); background: var(--glass); color: var(--cream);
  -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
}
button.primary { background: var(--cream); color: var(--ink); }
.toggle[aria-pressed="true"] { background: var(--runway-red); border-color: var(--runway-red); color: var(--cream); }
button:focus-visible { outline: 2px solid var(--cream); outline-offset: 3px; }
.moves { display: flex; gap: 10px; pointer-events: auto; }
.moves button { width: 58px; min-height: 58px; padding: 0; display: grid; place-items: center; touch-action: none; }
.moves svg { width: 22px; height: 22px; }
.foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.note { margin: 0; font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase; color: var(--cream-dim); }
.sound { width: 46px; padding: 0; display: grid; place-items: center; }
.sound svg { width: 20px; height: 20px; }
.sound .ic-on { display: none; }
.sound[aria-pressed="true"] .ic-on { display: block; }
.sound[aria-pressed="true"] .ic-off { display: none; }
.sound[aria-pressed="true"] { background: var(--cream); color: var(--ink); }
.loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); font-family: var(--display); font-style: italic; font-size: 1.4rem; transition: opacity 0.8s ease; pointer-events: none; }
.fallback { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-family: var(--display); font-size: 1.3rem; background: var(--ink); }
@media (max-width: 560px) {
  button { font-size: 0.64rem; padding: 0 12px; letter-spacing: 0.14em; }
  .foot { justify-content: center; text-align: center; }
}
</style>

<canvas id="scene" aria-label="Walkable 3D concept of a fashion runway in the Cour des Adieux, Château de Fontainebleau, built from photographs"></canvas>
<div class="shade" aria-hidden="true"></div>

<div class="ui">
  <header class="brand">
    <p class="eyebrow">Château de Fontainebleau</p>
    <h1>Le Défilé</h1>
    <p class="tag">Walk the runway before your guests do.</p>
  </header>

  <div class="bottom">
    <div class="moves" id="moves" hidden>
      <button id="back" type="button" aria-label="Walk backward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 4v16M5 13l7 7 7-7"/></svg></button>
      <button id="fwd" type="button" aria-label="Walk forward"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 20V4M5 11l7-7 7 7"/></svg></button>
    </div>
    <p class="hint" id="hint">Drag to look around.</p>
    <div class="controls">
      <button class="primary" id="tour" type="button">Walk the runway</button>
      <button type="button" class="toggle" id="explore" aria-pressed="false">Explore freely</button>
      <button type="button" class="toggle" id="today" aria-pressed="false">Show today</button>
      <button type="button" id="sound" class="sound" aria-pressed="false" aria-label="Turn music on">
        <svg class="ic-on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
      </button>
    </div>
    <div class="foot">
      <p class="note">Concept visualisation · façades and ground from photographs by Group G34 · models AI-generated</p>
      <p class="note">Section E2 · Group G34</p>
    </div>
  </div>
</div>
<div class="loading" id="loading">Setting the courtyard…</div>

      dly = ctx.createDelay(1); dly.delayTime.value = S16 * 3;
      var fb = ctx.createGain(); fb.gain.value = 0.38; var dg = ctx.createGain(); dg.gain.value = 0.35;
      var dl = ctx.createBiquadFilter(); dl.type = 'lowpass'; dl.frequency.value = 4500;
      dly.connect(dl); dl.connect(fb); fb.connect(dly); dl.connect(dg); dg.connect(master);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      var nd = noise.getChannelData(0); for (var i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
      document.addEventListener('visibilitychange', function () { if (!ctx) return; if (document.hidden) ctx.suspend(); else if (playing) ctx.resume(); });
    }
    function env(g, t, a, peak, d) { g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
    function duck(t) { synth.gain.setValueAtTime(0.35, t); synth.gain.linearRampToValueAtTime(1, t + 0.19); }
    function noiseHit(t, type, f, q, peak, d, wet, out) {
      var s = ctx.createBufferSource(); s.buffer = noise;
      var fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
      var g = ctx.createGain(); env(g, t, 0.001, peak, d);
      s.connect(fl); fl.connect(g); g.connect(out || drums); if (wet) g.connect(rev);
      s.start(t, Math.random() * 0.5); s.stop(t + d + 0.05);
    }
    function kick(t) {
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.setValueAtTime(160, t); o.frequency.exponentialRampToValueAtTime(46, t + 0.11);
      env(g, t, 0.002, 1.0, 0.3); o.connect(g); g.connect(drums); o.start(t); o.stop(t + 0.36);
      noiseHit(t, 'highpass', 3000, 0.7, 0.12, 0.012, false, drums);
      duck(t);
    }
    function clap(t) { [0, 0.011, 0.023].forEach(function (o, i) { noiseHit(t + o, 'bandpass', 1250, 1.1, i === 2 ? 0.42 : 0.3, i === 2 ? 0.16 : 0.02, i === 2); }); }
    function bass(t, f) {
      [['sawtooth', 0], ['square', -7]].forEach(function (k) {
        var o = ctx.createOscillator(); o.type = k[0]; o.frequency.value = f; o.detune.value = k[1];
        var fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = 4;
        fl.frequency.setValueAtTime(1100, t); fl.frequency.exponentialRampToValueAtTime(260, t + 0.16);
        var g = ctx.createGain(); env(g, t, 0.004, 0.13, 0.17);
        o.connect(fl); fl.connect(g); g.connect(synth); o.start(t); o.stop(t + 0.22);
      });
    }
    function stab(t, notes) {
      notes.forEach(function (f) {
        [-9, 9].forEach(function (det) {
          var o = ctx.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f * 2; o.detune.value = det;
          var fl = ctx.createBiquadFilter(); fl.type = 'lowpass'; fl.Q.value = 2;
          fl.frequency.setValueAtTime(5200, t); fl.frequency.exponentialRampToValueAtTime(700, t + 0.18);
          var g = ctx.createGain(); env(g, t, 0.003, 0.03, 0.2);
          o.connect(fl); fl.connect(g); g.connect(synth); g.connect(rev); o.start(t); o.stop(t + 0.26);
        });
      });
    }
    function pad(t, notes, dur, lvl) {
      notes.forEach(function (f) {
        var o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f;
        var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(lvl, t + 0.4);
        g.gain.setValueAtTime(lvl, t + dur - 0.2); g.gain.linearRampToValueAtTime(0.0001, t + dur + 0.8);
        o.connect(g); g.connect(synth); g.connect(rev); o.start(t); o.stop(t + dur + 0.9);
      });
    }
    function arp(t, f, lvl) {
      var o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f * 4;
      var o2 = ctx.createOscillator(); o2.type = 'sine'; o2.frequency.value = f * 8;
      var g = ctx.createGain(); env(g, t, 0.002, lvl, 0.14);
      var g2 = ctx.createGain(); g2.gain.value = 0.25;
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(synth); g.connect(dly);
      o.start(t); o2.start(t); o.stop(t + 0.2); o2.stop(t + 0.2);
    }
    function riser(t, dur) {
      var s = ctx.createBufferSource(); s.buffer = noise; s.loop = true;
      var fl = ctx.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 1.5;
      fl.frequency.setValueAtTime(400, t); fl.frequency.exponentialRampToValueAtTime(9000, t + dur);
      var g = ctx.createGain(); g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + dur);
      s.connect(fl); fl.connect(g); g.connect(master); g.connect(rev); s.start(t); s.stop(t + dur + 0.02);
    }
    function schedule(i, t) {
      var bar = Math.floor(i / 16), s = i % 16, ch = bar % 4, sec = bar % 32, notes = chords[ch];
      var intro = sec < 4, build = sec >= 4 && sec < 16, drop = sec >= 16 && sec < 28, brk = sec >= 28;
      var gap = (sec === 15 || sec === 31) && s > 8;
      if (s === 0) pad(t, notes, 16 * S16, intro || brk ? 0.045 : 0.022);
      if (s === 0 && (sec === 15 || sec === 31)) riser(t, 16 * S16);
      var full = build || drop;
      if (full && s % 4 === 0 && !gap) kick(t);
      if (full && (s === 4 || s === 12) && !gap) clap(t);
      if (s % 4 === 2) noiseHit(t, 'highpass', drop ? 6500 : 8000, 0.7, drop ? 0.16 : 0.1, drop ? 0.16 : 0.05);
      if ((full || intro) && s % 2 === 1) noiseHit(t, 'highpass', 10000, 0.7, 0.04, 0.03);
      if (full && !gap && [2, 6, 10, 14].indexOf(s) > -1) bass(t, roots[ch]);
      if (full && !gap && (s === 7 || s === 15)) bass(t, roots[ch] * 2);
      if (full && !gap && [0, 3, 6, 10, 13].indexOf(s) > -1) stab(t, notes);
      var pat = [0, 1, 2, 3, 2, 1, 3, 2];
      if (!gap) arp(t, notes[pat[s % 8]] * (s >= 8 && drop ? 2 : 1), drop ? 0.07 : 0.05);
    }
    function tick() { while (nextT < ctx.currentTime + 0.15) { schedule(step, nextT); nextT += S16; step++; } }
    return {
      start: function () {
        if (!AC) return;
        unlockIOS();
        if (!ctx) init();
        ctx.resume();
        if (playing) return;
        playing = true; step = 0; nextT = ctx.currentTime + 0.08;
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0.9, ctx.currentTime + 0.6);
        timer = setInterval(tick, 25); tick();
      },
      isPlaying: function () { return playing; },
      stop: function () {
        if (!ctx || !playing) return;
        playing = false;
        if (unlockEl) unlockEl.pause();
        master.gain.cancelScheduledValues(ctx.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
        master.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.2);
        setTimeout(function () { if (!playing) clearInterval(timer); }, 1300);
      }
    };
  })();
  var soundOn = true;

  var tourBtn = $('tour'), exploreBtn = $('explore'), todayBtn = $('today'), hint = $('hint'), moves = $('moves');
  function setMode(m) {
    mode = m;
    exploreBtn.setAttribute('aria-pressed', m === 'free' ? 'true' : 'false');
    moves.hidden = m !== 'free';
    tourBtn.textContent = m === 'tour' ? 'Pause' : (m === 'done' ? 'Walk again' : 'Walk the runway');
    hint.textContent = m === 'free' ? 'Drag to look. Walk with the arrows, or W A S D on a keyboard.'
      : m === 'tour' ? 'Walking the front row toward Napoleon’s staircase. Drag to look around.'
      : m === 'paused' ? 'Paused. Drag to look around.'
      : 'Drag to look around.';
  }
  tourBtn.addEventListener('click', function () {
    if (mode === 'tour') { setMode('paused'); return; }
    if (mode !== 'paused') { tourT = 0; look.yaw = 0; look.pitch = 0; }
    setMode('tour');
    if (soundOn) { Music.start(); syncSound(); }
  });
  exploreBtn.addEventListener('click', function () {
    if (mode === 'free') { setMode('idle'); return; }
    yaw += look.yaw; pitch += look.pitch; look.yaw = 0; look.pitch = 0;
    setMode('free');
  });
  var soundBtn = $('sound');
  function syncSound() {
    var on = Music.isPlaying();
    soundBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    soundBtn.setAttribute('aria-label', on ? 'Turn music off' : 'Turn music on');
  }
  soundBtn.addEventListener('click', function () {
    if (Music.isPlaying()) { Music.stop(); soundOn = false; } else { Music.start(); soundOn = true; }
    syncSound();
  });
  todayBtn.addEventListener('click', function () {
    set.visible = !set.visible;
    todayBtn.setAttribute('aria-pressed', set.visible ? 'false' : 'true');
    todayBtn.textContent = set.visible ? 'Show today' : 'Show the runway';
  });

  // drag to look (adds to the walk's own heading while touring)
  var dragging = false, lx = 0, ly = 0;
  canvas.addEventListener('pointerdown', function (e) { dragging = true; lx = e.clientX; ly = e.clientY; try { canvas.setPointerCapture(e.pointerId); } catch (_) {} });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging) return;
    var k = (camera.fov * Math.PI / 180) / canvas.clientHeight;
    var dy = -(e.clientX - lx) * k, dp = (e.clientY - ly) * k;
    if (mode === 'tour') { look.yaw += dy; look.pitch = Math.max(-0.8, Math.min(0.8, look.pitch + dp)); }
    else { yaw += dy; pitch = Math.max(-1.1, Math.min(1.1, pitch + dp)); }
    lx = e.clientX; ly = e.clientY;
  });
  ['pointerup', 'pointercancel'].forEach(function (ev) { canvas.addEventListener(ev, function () { dragging = false; }); });

  var input = { f: 0 }, keys = {};
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (['w', 'a', 's', 'd', 'arrowup', 'arrowdown', 'arrowleft', 'arrowright'].indexOf(k) < 0) return;
    if (mode !== 'free') { yaw += look.yaw; pitch += look.pitch; look.yaw = 0; look.pitch = 0; setMode('free'); }
    keys[k] = true; e.preventDefault();
  });
  window.addEventListener('keyup', function (e) { keys[e.key.toLowerCase()] = false; });
  function hold(btn, dir) {
    btn.addEventListener('pointerdown', function (e) { e.preventDefault(); input.f = dir; try { btn.setPointerCapture(e.pointerId); } catch (_) {} });
    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (ev) { btn.addEventListener(ev, function () { input.f = 0; }); });
  }
  hold($('fwd'), 1); hold($('back'), -1);

  function resize() {
    var w = canvas.clientWidth, h = canvas.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h; camera.fov = w < h ? 72 : 58; camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize); resize();

  var clock = new THREE.Clock(), idleT = 0;
  function frame() {
    var dt = Math.min(clock.getDelta(), 0.05);
    if (mode === 'tour') {
      tourT += dt;
      if (sampleTour(tourT)) { setMode('done'); }
    } else if (mode === 'free') {
      var f = input.f + ((keys.w || keys.arrowup) ? 1 : 0) - ((keys.s || keys.arrowdown) ? 1 : 0);
      var st = ((keys.d || keys.arrowright) ? 1 : 0) - ((keys.a || keys.arrowleft) ? 1 : 0);
      var sp = 4.2 * dt;
      pos.x += (Math.sin(yaw) * f + Math.cos(yaw) * st) * sp;
      pos.z += (-Math.cos(yaw) * f + Math.sin(yaw) * st) * sp;
      pos.x = Math.max(-44, Math.min(44, pos.x)); pos.z = Math.max(-124, Math.min(15, pos.z));
      var onRunway = set.visible && Math.abs(pos.x) < RW / 2 && pos.z < Z0 && pos.z > Z1;
      pos.y += ((onRunway ? RH + 1.65 : 1.65) - pos.y) * Math.min(1, dt * 5);
    } else if (mode === 'idle') {
      idleT += dt; yaw = Math.sin(idleT / 4) * 0.18;
    }
    camera.position.copy(pos);
    camera.rotation.set(pitch + (mode === 'tour' || mode === 'paused' || mode === 'done' ? look.pitch : 0), -(yaw + (mode === 'tour' || mode === 'paused' || mode === 'done' ? look.yaw : 0)), 0);
    models.forEach(function (m) { m.rotation.y = Math.atan2(camera.position.x - m.position.x, camera.position.z - m.position.z); });
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  setMode('idle');
  requestAnimationFrame(frame);
})();
</script>
